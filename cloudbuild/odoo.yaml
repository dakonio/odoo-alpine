steps:
  - id: Login
    name: gcr.io/cloud-builders/docker
    entrypoint: 'bash'
    args:
      - -c
      - docker login --username=$${USERNAME} --password=$${PASSWORD}
    secretEnv: ['USERNAME', 'PASSWORD']
  # - id: Build
  #   name: gcr.io/cloud-builders/docker
  #   entrypoint: 'bash'
  #   args:
  #     - -c
  #     - docker build -t ${BUILD_ID} . -f Dockerfile
  - id: Sliming
    name: gcr.io/cloud-builders/docker
    entrypoint: 'bash'
    args:
      - -c
      - |
        odoo_commit_sha=$(curl -s -X GET "https://api.github.com/repos/odoo/odoo/commits/${_ODOO_VERSION}" | python3 -c "import sys, json; print(json.load(sys.stdin)['sha'][:7])")
        echo ${odoo_commit_sha}
  # - id: Push
  #   name: gcr.io/cloud-builders/docker
  #   entrypoint: 'bash'
  #   args:
  #     - -c
  #     - docker push ${_REPOSITORY} --all-tags

options:
  substitutionOption: ALLOW_LOOSE

substitutions:
  _REPOSITORY: dakonio/odoo
  _ODOO_VERSION: "14.0"

availableSecrets:
  secretManager:
    - versionName: projects/${PROJECT_ID}/secrets/DOCKERHUB_USERNAME/versions/latest
      env: 'USERNAME'
    - versionName: projects/${PROJECT_ID}/secrets/DOCKERHUB_PASSWORD/versions/latest
      env: 'PASSWORD'
